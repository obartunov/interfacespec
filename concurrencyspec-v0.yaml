# concurrencyspec-v0: a second actor between callbacks of an open scan, and
# the set of allowed outcomes of a history (S6, indexam.sgml:1024-1032).
#
# Delta over protocolspec-v0: the scan protocol (state, obligations,
# domains, expectations) is used unchanged; nothing in it is changed.

version: concurrencyspec-v0
base: protocolspec-v0

actors:
  A: {protocol: index_scan}            # one scan, kept open across statements of one transaction
  B:                                   # another session, autocommit
    acts: between_callbacks            # only while A is between two of its callbacks
    operations:
      insert: {entries: inserted}      # adds index entries
      remove: {entries: removed}       # VACUUM: removes entries of rows deleted before A began
    state_of_operation:                # read from the server, never from elapsed time
      completed: the statement returned
      blocked: pg_stat_activity of B shows wait_event_type Lock, Buffer or BufferPin;
               B does nothing more in this history; the statement completes after A
               moves off the page or ends
      settled: after B's operation and after each step of A while it runs, the
               stand waits until B is completed or blocked (60 s - a hung stand, an
               error, not a state)

# indexam.sgml:1024-1032: "insertions or deletions [must] not cause the scan
# to miss or multiply return entries that were not themselves being
# inserted or deleted"; an inserted entry may or may not be returned, also
# upon rescan or backing up; a concurrent delete may or may not be
# reflected.
outcomes:
  must: stable                         # entries present when A began and not removed during the scan
  may: [inserted, removed]
  removed: >-
    an entry of a row deleted before A began, once it is observed gone from
    the index: after each step of A (and after B's remove), with B settled,
    a fresh forward scan from a third session lists what the index holds;
    the deleted entries it no longer lists are removed for that step and
    every later one.  Removal is monotonic, so an entry still listed was
    in the index during the whole step: it stays must.  Neither the
    presence of a remove in the history nor its start makes anything may;
    a blocked VACUUM that has not reached an entry leaves it must.
  must_not: other                      # entries that were never in the index during the scan
  rule: >-
    an inserted entry leaves the scan between the same reference entries (it
    does not move the protocolspec model; it does count as a returned entry
    for positioned/first/ran_off); a removed entry is optional: in its place
    the scan may return it or skip it; every other outcome is checked
    against the protocolspec model over the reference entries: in the order
    of the reference forward pass if amcanorder, otherwise in the order in
    which the scan first returns them (any not yet returned may come next)

# Boundary of the observer, not part of S6: an index entry is identified by
# its heap TID.  A history in which a concurrently inserted row gets the TID
# of an entry that was in the index when A began (TIDs freed by VACUUM) is
# outside the experiment: it ends as BOUNDARY, with no S6 verdict.
observer_boundary:
  entry_identity: heap TID
  outside: inserted row's TID in the reference set at the start of A

# S5-concurrent (indexam.sgml:1013-1020, 1024): "Both the scan position and
# the mark position (if any) must be maintained consistently".  The mark is
# a logical position over the reference entries, not a physical one: the
# protocolspec state (mark: s.pos) plus whether A stood between two
# reference entries after returning an inserted one (gap).  restore puts A
# back there; what A may then return is the S6 outcome set above.  If the
# marked entry is itself removed, the stable entries around it still fix
# the position; whether the removed marked entry may be returned once more
# right after restore is not said by the interface.
mark:
  position: [s.mark, gap]              # gap: A stood after an inserted entry when it marked
  marked_entry_removed: >-
    the next stable entry in the direction of the scan is still must and
    no stable entry before the mark may be returned; the removed marked
    entry returned again as the first outcome after restore ends the
    history as DOMAIN (no verdict)

# V5 line: index-only scan under concurrent VACUUM.  The observed actor is
# the executor's scan of the index (A2), not the AM: by S6 the AM may return
# the entry of a row removed during the scan, and only the executor's use of
# that entry (index data plus the visibility map instead of the heap) can be
# wrong.  A2 is a cursor in a REPEATABLE READ transaction; a FETCH is one
# step of A2, so B still acts between callbacks.
executor:
  actor:
    A2: {scan: cursor, isolation: repeatable read}   # one snapshot for A2 and its reference
  reference: >-
    the same query by a sequential scan, in A2's transaction after the cursor
    is closed (same snapshot)
  outcome: >-
    the rows A2 returned equal the reference rows (in order if the subject's
    query is ordered); a row missing from the reference is a row A2's
    snapshot cannot see
  identity: >-
    a row is identified by an immutable logical id column, not by its heap
    TID; a TID reused by B's insert is recorded, not excluded

# A's obligations and domains are evaluated on the observed state before
# each of A's operations: an operation outside them is not run (counted,
# not failed) and the history goes on.  A.get*3: three gets in the same
# direction, each checked (lets short histories cross pages).  B: any
# operation of B.  order: bodies hold these operations in this order.
generation:
  s6:
    contract: S6
    prologue: [A.begin, A.rescan(given)]
    alphabet: [A.get*3, B.insert, B.remove]
    limits: {B.insert: 2, B.remove: 1}
    coverage_over_subjects:            # live PostgreSQL behaviour the model needs; each in at least one history
      - "B.insert ran while A was open"
      - "B.remove started while A was open"
      - "an entry of a deleted row observed gone from the index while A was open"
      - "an entry of a deleted row still in the index after a remove started"
  s5_concurrent:
    contract: S5-concurrent
    prologue: [A.begin, A.rescan(given), A.get(forward)]
    alphabet: [A.get(forward), A.mark, A.restore, B.insert, B.remove]
    limits: {A.mark: 1, A.restore: 1, B: 1}
    order: [A.mark, A.restore]
    depth: 8
    coverage:                          # each must occur in at least one history that ran restore
      - "restore run"
      - "outcome checked after restore"
      - "B.insert between mark and restore"
      - "B.remove between mark and restore"
      - "B between mark and restore, then an outcome checked after restore"
      - "B between mark and restore, then an entry of another leaf returned after restore"
      - "entry of another leaf than the marked one returned after mark, before restore"
      - "entry of another leaf than the marked one returned after restore"
      - "insert between mark and restore: entry before the mark"
      - "insert between mark and restore: entry after the mark"
      - "remove between mark and restore, deleted entry before the mark"
      - "remove between mark and restore, deleted entry the marked entry"
      - "remove between mark and restore, deleted entry right after the mark"
      - "remove between mark and restore, deleted entry later"
      - "mark run, marked entry stable"
      - "mark run, marked entry deleted before A"
      - "mark run, marked entry inserted (gap)"
      - "inserted entry returned after restore"
  v5:
    contract: index-only scan returns only rows its snapshot sees
    prologue: [A2.fetch(1)]
    alphabet: [A2.fetch(1), A2.fetch(500), B.remove, B.insert]
    limits: {B.remove: 1, B.insert: 1}
    epilogue: [A2.fetch(all)]
    depth: 3
